<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Mock Interview</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container" style="max-width: 460px;">
        <h1><span class="icon-pop">🔑</span> Forgot Password</h1>
        <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/forgot-password" method="POST">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required>

            <button type="submit">Send Reset Link →</button>
        </form>

        <a href="/login" class="back-link">← Back to Log In</a>
    </div>

</body>
</html>
